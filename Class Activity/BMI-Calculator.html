<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BMI Calculator</title>
</head>
<body>

<div class="card">
  <h2>BMI Calculator</h2>

  <label for="weight">Weight (Kg)</label>
  <input type="number" id="weight" placeholder="e.g. 65">

  <label for="height">Height (m)</label>
  <input type="number" id="height" step="0.01" placeholder="e.g. 1.75">

  <button onclick="calculateBMI()">Calculate BMI</button>

  <div id="result"></div>
</div>

<script>
function calculateBMI() {
  const weight = parseFloat(document.getElementById("weight").value);
  const height = parseFloat(document.getElementById("height").value);
  const resultDiv = document.getElementById("result");

  if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
    resultDiv.textContent = "Please enter valid weight and height.";
    resultDiv.style.color = "red";
    return;
  }

  const bmi = weight / (height * height);
  let category;

  if (bmi < 18.5) {
    category = "Underweight";
  } else if (bmi < 25.0) {
    category = "Healthy / Normal Weight";
  } else if (bmi < 30.0) {
    category = "Overweight";
  } else {
    category = "Obese";
  }

  resultDiv.style.color = "#2c3e50";
  resultDiv.textContent = "BMI: " + bmi.toFixed(2) + " (" + category + ")";
}
</script>

</body>
</html>
